<section class="methodology compact-methodology supplement-panel" id="methodology" aria-labelledby="methodology-tab" hidden><div class="method-content"><p id="selection-method"></p><div class="method-grid">
<article><h3>成分范围</h3><p class="universe-method"></p><p>二级行业默认不勾选，勾选后在大图下方分别呈现，按最新统计季度的总市值降序排列。各图独立计算PE，不平均个股PE。当前固定成分回溯存在存续样本偏差，不等同于历年官方成分指数，不用于无前视回测。</p></article><article><h3>市值与 PE</h3><p>市值汇总各股季度最后交易日的总市值。无当日有效数据时，沿用此前最后一条有效市值，并记录日期；未重算停牌期间股本变动。左轴以万亿元显示，底层数据为亿元。</p><p>PE 采用整体法 TTM：有效样本总市值 ÷ 其滚动归母净利润，包含亏损。正 PE 公司的 TTM 利润由当日市值 / PE(TTM) 反推；亏损、缺 PE 或沿用旧市值的公司，从季末已披露财报重建，并查询调整前合并表和调整合并表以补回被后续更正覆盖的原始版本。按实际公告日（缺失时用公告日）筛选，仅纳入不晚于估值日的版本。缺少 TTM 的公司从分子和分母同时剔除；合计利润非正时留空。</p></article>
<article><h3>单季度财务</h3><p>采用合并营业总收入，缺失时使用营业收入；利润指归母净利润。Q1 直接取一季报，Q2 = 半年报 − Q1，Q3 = 三季报 − 半年报，Q4 = 年报 − 三季报，金额均为人民币亿元。</p><p>使用截至 2026-11-10 已披露的数据版本；早期缺报优先补充次年披露的调整合并表，差分可能受追溯调整影响。财务柱为事后观察，季度末 PE 仅使用该时点已披露信息，二者的信息日期不同。最新季度仅对缺报公司使用明确标注的估算。</p></article>
</div><div class="quality-note" id="quality-note"></div><details class="quality-details"><summary>逐季度查看覆盖率、缺失公司与沿用市值日期 <span>＋</span></summary><div class="table-scroll"><table><thead><tr><th>季度</th><th>财务覆盖</th><th>PE 市值覆盖</th><th>市值沿用</th><th>需要留意</th></tr></thead><tbody id="quality-body"></tbody></table></div></details><section class="estimate-panel" id="estimate-panel"></section><div class="reading-notes"><div class="industry-data-notes"></div><h3>PE尖峰显示</h3><p>每张图按所选区间的有效正 PE 独立判断：同时超过 Q3＋3×(Q3−Q1) 与中位数的3倍，才标为尖峰；少于8个有效季度不处理。Q1、Q3为25%、75%分位，采用排序后 (n−1)×p 位置线性插值。先排除 A 规则判出的候选尖峰，按其余有效 PE 计算右轴上限并留白。候选点只有超出该上限时才压缩到图顶附近、以“↑原始PE”标记，并将相邻线段改为虚线；仍在纵轴范围内的候选点按真实高度画实线、不加尖峰标记。虚线仅示意，不按其高度读取。无效或非正 PE 仍留空，缺口不连线。真实 PE、分位、表格及汇总数字不变，详细原值与判断门槛见悬浮说明。</p><h3>单季度与最近4季</h3><p>顶部控制统一作用于全部行业的大图、小图，包括时间区间、指标和数值标签。最近4季为每个季度及此前连续3季的营收、归母净利润合计，取数可超出当前显示区间；按每季当时已上市样本汇总。市值和PE仍为对应季度数据，PE分位按所选区间计算。最早3季因窗口不足留空；任一季度无样本、财务缺失时，最近4季财务留空并提示。含估算的窗口保留*标记。最近4季财务使用截至快照日财报，不等同于季末当时已披露的PE利润分母。底部季度及公司明细保留单季度口径。</p><h3>PE分位</h3><p>以当前选择区间内的有效季度 PE 为样本，PE分位 = 区间内不高于当前显示 PE 的季度数 ÷ 有效季度数，含相等值，显示一位小数。各行业独立计算，切换时间或拖动滑块时更新。主图按汇总栏当前季度（随悬停变化）计算；小图汇总按最新季度 PE 计算，即使该季度不在所选区间内。悬浮详情按所指季度计算。缺失、非正或不适用 PE 不参与统计；当前 PE 无效或区间没有有效样本时显示“—”。仅一个有效样本且与当前 PE 相等时为100%。分位是季度历史相对位置，不代表收益概率；顶部汇总中的全部指标及PE分位始终显示，不随图例开关隐藏。</p><h3>图表读法与数据来源</h3><p>指标图例可点击开关，同步控制主图和小图。关闭利润时，营收柱仍保持完整营收高度；关闭营收时，利润独立绘制。小图共享上方时间范围，各自独立缩放纵轴。柱形采用独立亿元刻度，不能用左侧市值轴读取。利润色块固定在营收柱底，利润数字放在柱底下方，与上方营收数字分开；亏损色块和数字显示在零线下方。底部滑块可查看 2005 年起的完整历史。金额标签 * 表示含估算，† 表示财务缺失；空心 PE 点表示样本市值覆盖不足 100%。</p><p>数据：Tushare；截至 2026-11-10 的静态快照，不自动更新。估算仅为研究假设，正式财报披露后应替换为实际值；展示精度不代表估计精度。</p><div class="source-links" id="source-links"></div></div></div></section></template></body></html>
