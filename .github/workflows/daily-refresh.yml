name: A-Total online refresh

on:
  schedule:
    # UTC 08:30 = Asia/Shanghai 16:30; exchange holidays are checked below.
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - sw-electronics/**

permissions:
  contents: read

concurrency:
  group: a-total-online
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Shanghai and Shenzhen trading calendars
        id: calendar
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python work/cloud_refresh.py calendar
      - uses: actions/setup-node@v4
        if: steps.calendar.outputs.is_open == 'true'
        with:
          node-version: '22'
      - name: Restore incremental response caches
        id: cache
        continue-on-error: true
        if: steps.calendar.outputs.is_open == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/incremental-ranges
            .tools/large-money-markets
            .tools/large-money-blocks
            .tools/retail-history
            .tools/etf-flow-history
            .tools/northbound-holdings
            .tools/reverse-repo
            .tools/refinancing
            .tools/refresh-state.json
          key: a-total-data-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: a-total-data-v1-${{ runner.os }}-
      - name: Install PDF reader for SSE monthly accounts
        if: steps.calendar.outputs.is_open == 'true'
        run: python -m pip install 'PyMuPDF==1.26.6'
      - name: Check refresh safeguards
        if: steps.calendar.outputs.is_open == 'true'
        run: |
          python -m unittest discover -s work -p 'test_cloud_refresh.py'
          python -m unittest discover -s work -p 'test_refresh_*.py'
          node work/test_atomic_build.cjs
      - name: Refresh all modules and build the online entry
        id: build
        if: steps.calendar.outputs.is_open == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          MARKET_END_DATE: ${{ steps.calendar.outputs.date }}
        run: node work/build_market_dashboard.js --online-only
      - name: Record source dates and current-day availability
        if: always() && steps.calendar.outputs.is_open == 'true'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python work/cloud_refresh.py report
      - name: Verify and commit only refresh outputs
        id: commit
        if: success() && steps.calendar.outputs.is_open == 'true'
        run: python work/cloud_refresh.py commit
      - name: Save caches after successful commit
        if: success() && steps.calendar.outputs.is_open == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/incremental-ranges
            .tools/large-money-markets
            .tools/large-money-blocks
            .tools/retail-history
            .tools/etf-flow-history
            .tools/northbound-holdings
            .tools/reverse-repo
            .tools/refinancing
            .tools/refresh-state.json
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Keep the run report, including failures
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a-total-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/cloud-calendar.json
            outputs/cloud-refresh-latest.json
            outputs/cloud-refresh-latest.md
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: refresh
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (needs.refresh.result == 'success' && needs.refresh.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - name: Package tracked site files, preserving industry subpages
        run: |
          mkdir -p "$RUNNER_TEMP/a-total-pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/a-total-pages"
          git rev-parse HEAD > "$RUNNER_TEMP/a-total-pages/deployment-version.txt"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/a-total-pages
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published revision and main page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 work/cloud_refresh.py verify-live
